name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-plane-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: control_plane_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d control_plane_migration_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Check out current CrowdRelay main for management compatibility
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: wojciechbator/crowdrelay
          ref: main
          path: .compat/crowdrelay
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Static and Python contract gates
        run: |
          python3 scripts/static-check.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/check_crowdrelay_compat.py .compat/crowdrelay
      - name: PostgreSQL migration smoke
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for migration in migrations/*.sql; do
            echo "==> ${migration}"
            psql \
              --host 127.0.0.1 \
              --port 5432 \
              --username postgres \
              --dbname control_plane_migration_test \
              --set ON_ERROR_STOP=1 \
              --file "${migration}"
          done
          echo "CONTROL_PLANE_MIGRATIONS=PASS"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace

  dependency-security:
    name: Dependency security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
      - name: Cache pinned cargo-audit binary
        id: cargo-audit-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-0.22.2
      - name: Install pinned cargo-audit
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Audit reachable Rust dependencies
        shell: bash
        run: |
          set -euo pipefail
          rsa_graph="$(cargo tree --locked --workspace --all-features -i rsa 2>/dev/null)"
          if [[ -n "$rsa_graph" ]]; then
            echo "RUSTSEC-2023-0071 is reachable in an active dependency graph:" >&2
            echo "$rsa_graph" >&2
            exit 1
          fi
          cargo audit --ignore RUSTSEC-2023-0071

  container:
    name: Build production container (${{ matrix.arch }})
    # linux/amd64 and linux/arm64 are both production targets, so each is built
    # on its own native runner. QEMU cross-building a release Rust binary does
    # not fit this job's budget, and an amd64-only release cannot be pulled by
    # virya-crowdrelay.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR for validated main builds
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build exact ${{ matrix.platform }} production image
        env:
          CACHE_WRITE: ${{ github.ref == 'refs/heads/main' }}
          PUBLISH_IMAGE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          cache_args=(--cache-from "type=gha,scope=control-plane-image-${ARCH}")
          if [[ "${CACHE_WRITE}" == "true" ]]; then
            cache_args+=(--cache-to "type=gha,mode=max,scope=control-plane-image-${ARCH}")
          fi
          # Per-architecture tags only. The manifest list that production pins
          # is assembled from them in the container-manifest job, so a release
          # index can never exist with a platform missing.
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/crowdrelay-control-plane:sha-${GITHUB_SHA}-${ARCH}"
          if [[ "${PUBLISH_IMAGE}" == "true" ]]; then
            docker buildx build \
              --platform "$PLATFORM" \
              --build-arg "VCS_REF=${GITHUB_SHA}" \
              "${cache_args[@]}" \
              --tag "$image" \
              --push \
              .
            docker pull "$image" >/dev/null
            architecture="$(docker image inspect "$image" --format '{{.Architecture}}')"
            revision="$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          else
            docker buildx build \
              --platform "$PLATFORM" \
              --build-arg "VCS_REF=${GITHUB_SHA}" \
              "${cache_args[@]}" \
              --tag crowdrelay-control-plane:ci \
              --load \
              .
            architecture="$(docker image inspect crowdrelay-control-plane:ci --format '{{.Architecture}}')"
            revision="$(docker image inspect crowdrelay-control-plane:ci --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          fi
          [[ "$architecture" == "$ARCH" ]]
          [[ "$revision" == "$GITHUB_SHA" ]]
          echo "CONTROL_PLANE_CONTAINER=PASS architecture=$architecture revision=$revision cache=gha write=${CACHE_WRITE} publish=${PUBLISH_IMAGE}"

  container-manifest:
    name: Publish multi-platform manifest
    needs: container
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble and verify the release index
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/crowdrelay-control-plane:sha-${GITHUB_SHA}"
          docker buildx imagetools create --tag "$image" "${image}-amd64" "${image}-arm64"
          # An index missing a production platform is an undeployable release:
          # virya-crowdrelay is linux/arm64 and cannot pull an amd64-only tag.
          platforms="$(docker buildx imagetools inspect "$image" --raw \
            | jq -r '[.manifests[] | select(.platform.os != "unknown") | "\(.platform.os)/\(.platform.architecture)"] | sort | join(",")')"
          [[ "$platforms" == "linux/amd64,linux/arm64" ]] || {
            echo "ERROR: release index platforms=$platforms" >&2
            exit 1
          }
          digest="$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p image-digest
          printf 'CONTROL_PLANE_RELEASE_SHA=%s\nCONTROL_PLANE_IMAGE_DIGEST=%s\n' \
            "$GITHUB_SHA" "$digest" > image-digest/image.env
          # upload-artifact flattens image-digest/ away, so the checksum has to
          # name the file as it appears in the download, not as it sits here.
          ( cd image-digest && sha256sum image.env > image.env.sha256 )
          echo "CONTROL_PLANE_MANIFEST=PASS platforms=$platforms digest=$digest"
      - name: Upload immutable image digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: control-plane-image-digest-${{ github.sha }}
          path: image-digest/
          if-no-files-found: error
          retention-days: 30

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm run budget